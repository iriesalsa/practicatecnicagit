<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="owlFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="owlMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45f3d1"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <!-- Fondo circular azul marino profundo -->
  <circle cx="50" cy="50" r="48" fill="#060d1f"/>
  <!-- Silueta facial azul rey terminada en punta -->
  <path d="M22 30 C16 40 16 58 24 70 C31 80 43 85 50 90 C57 85 69 80 76 70 C84 58 84 40 78 30 L50 22 Z" fill="url(#owlFace)"/>
  <!-- Separación sutil superior e inferior -->
  <path d="M50 84 L48 91 L52 91 Z" fill="#060d1f"/>
  <!-- Cejas / orejas anguladas en verde menta -->
  <polygon points="16,22 44,34 38,41 21,32" fill="url(#owlMint)"/>
  <polygon points="84,22 56,34 62,41 79,32" fill="url(#owlMint)"/>
  <!-- Ojo izquierdo -->
  <circle cx="34" cy="51" r="16" fill="#060d1f"/>
  <circle cx="34" cy="51" r="13" fill="url(#owlMint)"/>
  <circle cx="34" cy="51" r="8.2" fill="#060d1f"/>
  <circle cx="31" cy="48" r="2.7" fill="#ffffff"/>
  <!-- Ojo derecho -->
  <circle cx="66" cy="51" r="16" fill="#060d1f"/>
  <circle cx="66" cy="51" r="13" fill="url(#owlMint)"/>
  <circle cx="66" cy="51" r="8.2" fill="#060d1f"/>
  <circle cx="63" cy="48" r="2.7" fill="#ffffff"/>
  <!-- Pico diamante verde menta -->
  <polygon points="50,55 58,66 50,82 42,66" fill="url(#owlMint)" stroke="#060d1f" stroke-width="2.5" stroke-linejoin="round"/>
</svg>