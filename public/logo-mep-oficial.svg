<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 110" role="img" aria-label="Ministerio de Educación Pública - Gobierno de Costa Rica">
  <defs>
    <linearGradient id="crBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002b7f"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="crRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ce1126"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <!-- Tarjeta limpia con contraste nitido en modo claro y oscuro -->
  <rect x="2" y="2" width="356" height="106" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Emblema tricolor estilizado de Costa Rica -->
  <g transform="translate(18, 17)">
    <rect x="0" y="0" width="76" height="76" rx="12" fill="#0f172a"/>
    <rect x="8" y="10" width="60" height="10" rx="2" fill="url(#crBlue)"/>
    <rect x="8" y="22" width="60" height="7" rx="1" fill="#ffffff"/>
    <rect x="8" y="31" width="60" height="14" rx="2" fill="url(#crRed)"/>
    <rect x="8" y="47" width="60" height="7" rx="1" fill="#ffffff"/>
    <rect x="8" y="56" width="60" height="10" rx="2" fill="url(#crBlue)"/>
    <!-- Sello dorado educativo -->
    <circle cx="38" cy="38" r="11" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
    <polygon points="38,30 47,36 38,42 29,36" fill="#002b7f"/>
    <rect x="36" y="41" width="4" height="5" fill="#f59e0b"/>
  </g>
  <!-- Tipografia oficial nitida -->
  <text x="110" y="42" fill="#0f172a" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" letter-spacing="1">MINISTERIO</text>
  <text x="110" y="64" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" letter-spacing="0.4">DE EDUCACIÓN PÚBLICA</text>
  <line x1="110" y1="73" x2="338" y2="73" stroke="#002b7f" stroke-width="2"/>
  <text x="110" y="90" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.1">GOBIERNO DE COSTA RICA</text>
</svg>