  <circle cx="84" cy="64" r="18.5" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <circle cx="46" cy="64" r="9.5" fill="#0f172a"/>
  <circle cx="82" cy="64" r="9.5" fill="#0f172a"/>
  <circle cx="49.5" cy="59.5" r="3.4" fill="#ffffff"/>
  <circle cx="85.5" cy="59.5" r="3.4" fill="#ffffff"/>
  <circle cx="43.5" cy="68" r="1.4" fill="#93c5fd"/>
  <circle cx="79.5" cy="68" r="1.4" fill="#93c5fd"/>
  <!-- Pico dorado centrado -->
  <polygon points="64,74 54.5,89 73.5,89" fill="url(#bdsBeakGold)" stroke="#fef08a" stroke-width="1.8" stroke-linejoin="round"/>
